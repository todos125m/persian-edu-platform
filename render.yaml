# Render Blueprint for the NestJS backend.
# Use:  Render Dashboard -> New + -> Blueprint -> connect this repo.
# Secrets (sync:false) must be filled in the dashboard during setup.
services:
  - type: web
    name: persian-edu-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: ZARINPAL_MERCHANT_ID
        value: test-merchant-id
      - key: ZARINPAL_SANDBOX
        value: "true"
